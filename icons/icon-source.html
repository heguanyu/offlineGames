<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:transparent}
  #wrap{width:100vw;height:100vh}
  svg{display:block;width:100%;height:100%}
</style></head><body>
<div id="wrap">
<svg id="ic" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#26264a"/>
      <stop offset="100%" stop-color="#14141f"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7ee"/><stop offset="100%" stop-color="#ece1c8"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef1f6"/>
    </linearGradient>
    <radialGradient id="felt" cx="42%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#3aa065"/><stop offset="100%" stop-color="#1e6b40"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d97ff"/><stop offset="100%" stop-color="#4a63d8"/>
    </linearGradient>
    <radialGradient id="ball8" cx="38%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#3a3a46"/><stop offset="60%" stop-color="#17171d"/><stop offset="100%" stop-color="#0c0c11"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- four game tiles (2x2). M=56 gap=28 size=186 -->
  <g filter="url(#sh)">
    <!-- ① mahjong tile: ivory with red 中 -->
    <g>
      <rect x="56" y="56" width="186" height="186" rx="36" fill="url(#ivory)" stroke="#d8cba8" stroke-width="2"/>
      <text x="149" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="132" font-weight="800" fill="#d0344f" text-anchor="middle" dominant-baseline="central">中</text>
    </g>

    <!-- ② cards: white with heart + spade suits -->
    <g>
      <rect x="270" y="56" width="186" height="186" rx="36" fill="url(#white)"/>
      <text x="345" y="140" font-family="'Segoe UI Symbol','Arial',sans-serif" font-size="112" fill="#e23a4e" text-anchor="middle" dominant-baseline="central">&#9829;</text>
      <text x="392" y="188" font-family="'Segoe UI Symbol','Arial',sans-serif" font-size="72" fill="#26263a" text-anchor="middle" dominant-baseline="central">&#9824;</text>
    </g>

    <!-- ③ pool: felt-green tile with the 8-ball -->
    <g>
      <rect x="56" y="270" width="186" height="186" rx="36" fill="url(#felt)"/>
      <circle cx="149" cy="363" r="62" fill="url(#ball8)"/>
      <circle cx="149" cy="363" r="30" fill="#ffffff"/>
      <text x="149" y="365" font-family="'Arial Black','Arial',sans-serif" font-size="42" font-weight="900" fill="#14141a" text-anchor="middle" dominant-baseline="central">8</text>
      <ellipse cx="128" cy="338" rx="20" ry="12" fill="#ffffff" opacity="0.18"/>
    </g>

    <!-- ④ future / small games: game controller -->
    <g>
      <rect x="270" y="270" width="186" height="186" rx="36" fill="url(#pad)"/>
      <g transform="translate(303,303) scale(5)" fill="#ffffff">
        <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
      </g>
    </g>
  </g>
</svg>
</div>
</body></html>
