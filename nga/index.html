<!DOCTYPE html>
<html lang="zh-Hans" data-theme-scope="nga">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NGA</title>
<link rel="manifest" href="../manifest.webmanifest">
<script>window.__ownsHistory = true;</script>
<script src="../app-nav.js"></script>
<script src="../shared/theme.js"></script>
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1e1e2e">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="./nga.css">
</head>
<body>
  <!-- 版块 / 主题列表 (board thread list) -->
  <section id="list-view">
    <header class="bar">
      <a class="back" href="../" onclick="event.preventDefault(); location.replace('../')" aria-label="返回">‹ 返回</a>
      <h1>NGA</h1>
      <button id="btn-theme" class="bar-btn" type="button" aria-label="主题">🎨</button>
      <button id="btn-refresh" class="bar-btn" type="button" aria-label="刷新">↻</button>
    </header>
    <div class="listctl">
      <nav id="boards" class="tabs"></nav>
      <button id="btn-filter" class="filter-btn" type="button" hidden>版块 ▾</button>
    </div>
    <div id="filter-panel" class="filter-panel" hidden></div>
    <main id="threads" class="scroll"></main>
    <footer id="list-pager" class="pager" hidden>
      <button id="lp-prev" class="pg-btn" type="button">‹ 上一页</button>
      <span id="lp-info"></span>
      <button id="lp-next" class="pg-btn" type="button">下一页 ›</button>
    </footer>
  </section>

  <!-- 主题阅读 (thread reader) -->
  <section id="thread-view" hidden>
    <header class="bar">
      <button class="back" id="btn-to-list" type="button">‹ 版块</button>
      <h1 id="thread-title">主题</h1>
      <button id="btn-thread-refresh" class="bar-btn" type="button" aria-label="刷新">↻</button>
    </header>
    <main id="posts" class="scroll"></main>
    <footer id="thread-pager" class="pager" hidden>
      <button id="tp-prev" class="pg-btn" type="button">‹ 上一页</button>
      <span id="tp-info"></span>
      <button id="tp-next" class="pg-btn" type="button">下一页 ›</button>
    </footer>
  </section>

  <!-- image lightbox (tap a post image to zoom) -->
  <div id="lightbox" class="lightbox" hidden>
    <button id="lb-close" class="lb-close" type="button" aria-label="关闭">✕</button>
    <div id="lb-scroll" class="lb-scroll"><img id="lb-img" alt="图片"></div>
  </div>

  <div id="toast" hidden></div>

  <!-- 主题配色 popover -->
  <div id="theme-pop" class="theme-pop" hidden>
    <div class="pop-label">主题配色</div>
    <div id="theme-mount"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
