<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Controller Test</title>
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<script src="../../app-nav.js"></script>
<link rel="icon" href="../../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a1a2e">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #1a1a2e;
    color: #eaeaea;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px 16px;
  }
  a.back { align-self: flex-start; color: #8a8aa3; text-decoration: none; font-size: 0.9rem; }
  #status { margin: 10px 0 4px; font-size: 1rem; color: #e9c46a; text-align: center; }
  #status.connected { color: #7ddf8a; }
  #last-pressed { font-size: 0.85rem; color: #8a8aa3; margin-bottom: 14px; min-height: 1.2em; }

  #panel { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; justify-content: center; }

  .stick {
    width: 110px; height: 110px;
    border: 2px solid #2c3a63; border-radius: 50%;
    position: relative;
  }
  .stick .dot {
    width: 30px; height: 30px;
    background: #4ea8de; border-radius: 50%;
    position: absolute; left: 40px; top: 40px;
    transition: background 0.1s;
  }
  .stick .dot.clicked { background: #e94560; }
  .stick .label {
    position: absolute; bottom: -22px; width: 100%;
    text-align: center; font-size: 0.75rem; color: #8a8aa3;
  }

  #buttons {
    display: grid;
    grid-template-columns: repeat(6, 56px);
    gap: 8px;
  }
  .btn {
    height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: #16213e; border: 1px solid #2c3a63; border-radius: 8px;
    font-size: 0.8rem; color: #8a8aa3;
  }
  .btn.on { background: #e94560; color: #fff; border-color: #e94560; }

  .triggers { display: flex; gap: 14px; }
  .trigger { width: 26px; height: 110px; border: 2px solid #2c3a63; border-radius: 6px;
    position: relative; overflow: hidden; }
  .trigger .fill {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
    background: #4ea8de;
  }
  .trigger .label {
    position: absolute; bottom: -22px; width: 100%;
    text-align: center; font-size: 0.75rem; color: #8a8aa3;
  }
</style>
</head>
<body>
  <a class="back" href="../../">&larr; back</a>
  <p id="status">No controller — press any button on the pad to wake it up</p>
  <p id="last-pressed"></p>

  <div id="panel">
    <div class="stick" id="stick-left"><div class="dot"></div><div class="label">Left stick</div></div>
    <div class="triggers">
      <div class="trigger" id="trig-lt"><div class="fill"></div><div class="label">LT</div></div>
      <div class="trigger" id="trig-rt"><div class="fill"></div><div class="label">RT</div></div>
    </div>
    <div id="buttons"></div>
    <div class="stick" id="stick-right"><div class="dot"></div><div class="label">Right stick</div></div>
  </div>

  <script>
    // Standard-mapping button order; matches Xbox pads on iPadOS/Safari.
    const BUTTON_NAMES = ['A', 'B', 'X', 'Y', 'LB', 'RB', 'LT', 'RT',
      'View', 'Menu', 'L3', 'R3', 'Up', 'Down', 'Left', 'Right', 'Xbox'];

    const statusEl = document.getElementById('status');
    const lastPressedEl = document.getElementById('last-pressed');
    const buttonsEl = document.getElementById('buttons');
    const buttonEls = BUTTON_NAMES.map(name => {
      const el = document.createElement('div');
      el.className = 'btn';
      el.textContent = name;
      buttonsEl.appendChild(el);
      return el;
    });
    const leftDot = document.querySelector('#stick-left .dot');
    const rightDot = document.querySelector('#stick-right .dot');
    const ltFill = document.querySelector('#trig-lt .fill');
    const rtFill = document.querySelector('#trig-rt .fill');

    function moveDot(dot, x, y, clicked) {
      // Stick is 110px wide, dot 30px: center 40px, max travel 40px.
      dot.style.left = (40 + x * 40) + 'px';
      dot.style.top = (40 + y * 40) + 'px';
      dot.classList.toggle('clicked', clicked);
    }

    function frame() {
      // The Gamepad API is poll-based: re-read state every frame.
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const pad = Array.from(pads).find(p => p && p.connected);

      if (pad) {
        statusEl.textContent = pad.id +
          (pad.mapping === 'standard' ? '' : ' (non-standard mapping!)');
        statusEl.classList.add('connected');

        pad.buttons.forEach((b, i) => {
          if (i < buttonEls.length) {
            buttonEls[i].classList.toggle('on', b.pressed);
            if (b.pressed) lastPressedEl.textContent = 'last pressed: ' + BUTTON_NAMES[i];
          }
        });
        moveDot(leftDot, pad.axes[0] || 0, pad.axes[1] || 0, pad.buttons[10]?.pressed);
        moveDot(rightDot, pad.axes[2] || 0, pad.axes[3] || 0, pad.buttons[11]?.pressed);
        ltFill.style.height = ((pad.buttons[6]?.value || 0) * 100) + '%';
        rtFill.style.height = ((pad.buttons[7]?.value || 0) * 100) + '%';
      } else {
        statusEl.textContent = 'No controller — press any button on the pad to wake it up';
        statusEl.classList.remove('connected');
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
