<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>国标（无定番） · MCR no-minimum</title>
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<script src="../../app-nav.js"></script>
<link rel="icon" href="../../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2a1e">
<link rel="stylesheet" href="../mahjong-common/board.css">
<link rel="stylesheet" href="../guobiao/guobiao.css">
<!-- Online play is driven by the lobby/server (no local difficulty pick). Hide the difficulty
     start screen BEFORE first paint so it never flashes while the deferred module boots. -->
<script>if (new URLSearchParams(location.search).get('online')) document.documentElement.dataset.online = '1';</script>
<style>html[data-online] #start-overlay { display: none !important; }</style>
</head>
<body>
  <header>
    <a class="back" href="../../">&larr;</a>
    <div id="round-info"></div>
    <span id="wall-count"></span>
    <label id="fast-toggle" title="快速模式：关闭电脑出牌动画"><input type="checkbox" id="fast-mode-chk"><span>快速</span></label>
    <button id="sound-btn" title="音效">🔊</button>
    <button id="menu-btn" title="菜单">≡</button>
  </header>

  <main id="table">
    <canvas id="scene"></canvas>
    <div id="score-stack"><div id="scores"></div></div>
    <div class="hud plate-bottom" id="plate-0"></div>
    <div class="hud plate-right"  id="plate-1"></div>
    <div class="hud plate-top"    id="plate-2"></div>
    <div class="hud plate-left"   id="plate-3"></div>
    <div id="action-hud">
      <div id="action-bar"></div>
      <div class="hint" id="hand-hint"></div>
    </div>
    <!-- online only: countdown to the server's auto-act on your turn -->
    <div id="turn-timer" class="ring-timer hidden" aria-hidden="true"><span id="turn-timer-num" class="rt-num"></span></div>
  </main>
  <div id="ting-center"></div>
  <div id="ting-banner"></div>

  <div class="overlay" id="start-overlay">
    <div class="panel">
      <h2>国标（无定番）</h2>
      <p class="sub">国标规则 · 可吃碰杠 · 自摸/点炮 · <b>无定番</b>（任意番数皆可和）</p>
      <div class="level-row" id="level-row">
        <div class="level-btn" data-level="1"><b>新手</b><span>随手出牌</span></div>
        <div class="level-btn sel" data-level="2"><b>普通</b><span>看张做番</span></div>
        <div class="level-btn" data-level="3"><b>高手</b><span>做大牌、防点炮</span></div>
      </div>
      <button class="big-btn" id="start-btn">开始牌局</button>
      <button class="link-btn" id="rules-link">查看规则 / Rules</button>
      <button class="big-btn hub" id="start-hub-link">← 返回主页</button>
    </div>
  </div>

  <div class="overlay hidden" id="result-overlay">
    <div id="result-frame">
    <div class="panel">
      <button class="corner-btn back" id="back-hub-btn">返回</button>
      <button class="corner-btn next" id="next-hand-btn">下一局</button>
      <h2 id="result-title"></h2>
      <div id="result-fans"></div>
      <div id="result-score"></div>
      <div id="result-cols">
        <div id="result-pattern">
          <div id="result-winning"></div>
          <div id="result-hand"></div>
        </div>
        <div id="result-payments" class="sub"></div>
      </div>
    </div>
    <!-- every seat's revealed hand, pinned just outside the panel on its seat's edge
         (玩家 bottom / 对家 top / 下家 right / 上家 left), each tagged with its hand score -->
    <div class="seat-hand top"    id="seat-hand-2" aria-hidden="true"></div>
    <div class="seat-hand right"  id="seat-hand-1" aria-hidden="true"></div>
    <div class="seat-hand left"   id="seat-hand-3" aria-hidden="true"></div>
    <div class="seat-hand bottom" id="seat-hand-0" aria-hidden="true"></div>
    </div>
  </div>

  <div class="overlay hidden" id="menu-overlay">
    <div class="panel">
      <h2>菜单</h2>
      <button class="big-btn" id="resume-btn">继续</button>
      <button class="big-btn danger" id="newgame-btn">重开（清零比分）</button>
      <button class="big-btn danger" id="menu-forfeit-btn" hidden>🏳️ 认输退出</button>
      <button class="link-btn" id="menu-rules-link">规则</button>
      <button class="big-btn hub" id="menu-hub-btn">← 返回大厅</button>
    </div>
  </div>

  <!-- online: confirm forfeiting the live game (your seat → a bot; no lifetime score for this 场) -->
  <div class="overlay hidden" id="forfeit-confirm-overlay">
    <div class="panel">
      <h2>🏳️ 确认认输？</h2>
      <p class="sub">认输后你将<b>退出本局</b>，座位交由<b>电脑接管</b>；本局<b>不计入</b>你的总分。此操作无法撤销。</p>
      <button class="big-btn danger" id="forfeit-confirm-yes">确认认输</button>
      <button class="big-btn" id="forfeit-confirm-no">取消</button>
    </div>
  </div>

  <div class="overlay hidden" id="rules-overlay">
    <div class="panel">
      <h2>国标（无定番）规则</h2>
      <div class="rules-text" id="rules-body"></div>
      <button class="big-btn" id="rules-close" style="margin-top:16px;">明白了</button>
    </div>
  </div>

  <!-- 一场结束 · 最终成绩 (online) -->
  <div class="overlay hidden" id="final-overlay">
    <div class="panel">
      <h2 id="final-title">一场结束 · 最终成绩</h2>
      <div id="final-congrats"></div>
      <div id="final-standings"></div>
      <details id="final-rounds-wrap"><summary>每圈成绩</summary><div id="final-rounds"></div></details>
      <button class="big-btn hub" id="final-hub-btn">← 返回大厅</button>
    </div>
  </div>

  <!-- online: lost the server connection (then auto-returns to the lobby) -->
  <div class="overlay hidden" id="reconnect-overlay">
    <div class="panel">
      <h2>🔌 连接已断开</h2>
      <p class="sub">正在重新连接服务器… 若服务器正在维护，将返回大厅。</p>
    </div>
  </div>

  <div id="toast"></div>
  <script>window.MJ_CONFIG = { minFan: 0, baseScore: 4, sessionKey: 'guobiao-free' };</script>
  <script type="module" src="../guobiao/main.js"></script>
</body>
</html>
