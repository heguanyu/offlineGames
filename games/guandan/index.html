<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>掼蛋 · Guandan</title>
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<script src="../../app-nav.js"></script>
<link rel="icon" href="../../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2a1e">
<link rel="stylesheet" href="./guandan.css">
</head>
<body>
  <!-- nav: a top bar in 3D/desktop, a vertical left rail on phones (like the other games) -->
  <header id="nav">
    <div id="round-info"></div>
    <span class="spacer"></span>
    <button id="mute-btn" type="button">🔊</button>
    <button id="menu-btn" type="button">≡</button>
  </header>

  <div id="table">
    <canvas id="scene"></canvas>

    <!-- team-level scoreboard, top-right -->
    <div id="scores"></div>

    <!-- per-seat overlays injected by main.js -->
    <div id="overlays"></div>

    <!-- bottom action bar (不要 / 提示 / 出牌) -->
    <div id="actions" hidden></div>

    <!-- hand-management tools live below the hand, separate from turn actions -->
    <div id="hand-tools" hidden>
      <button id="auto-arrange-btn" class="hand-tool" type="button" disabled>自动理牌</button>
      <button id="group-btn" class="hand-tool" type="button" disabled>组牌</button>
    </div>
  </div>

  <!-- start screen -->
  <div id="start-overlay" class="overlay">
    <div class="panel">
      <h1>掼蛋</h1>
      <p class="sub">4 人 2 队 · 你 + 对家 vs 右家/左家 · 从 2 打到 A</p>
      <p id="resume-note" class="resume-note" hidden></p>
      <button class="act-btn" id="start-btn" style="width:100%;margin-top:8px">开始</button>
      <button class="act-btn ghost" id="reset-btn" hidden style="width:100%;margin-top:10px">重新开始（清零等级）</button>
    </div>
  </div>

  <!-- result -->
  <div id="result-overlay" class="overlay" hidden>
    <div class="panel">
      <div id="result-title"></div>
      <div id="result-detail"></div>
      <div id="result-score"></div>
      <button class="act-btn" id="next-btn" style="width:100%;margin-bottom:10px">下一局</button>
      <button class="act-btn ghost" id="result-home" style="width:100%">← 返回大厅</button>
    </div>
  </div>

  <!-- menu (≡) -->
  <div id="menu-overlay" class="overlay" hidden>
    <div class="panel">
      <h1>菜单</h1>
      <button class="act-btn" id="menu-continue" style="width:100%;margin-bottom:10px">继续</button>
      <button class="act-btn no" id="menu-restart" style="width:100%;margin-bottom:10px">重开（清零比分）</button>
      <button class="act-btn ghost" id="menu-home" style="width:100%">← 返回大厅</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
