<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>天津麻将联机版 · 大厅</title>
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<script src="../../app-nav.js"></script>
<link rel="icon" href="../../icons/icon-180.png">
<!-- Match the hub's iOS standalone behavior: no viewport-fit=cover, so iOS insets the
     content below the system status bar instead of drawing the sticky header under it. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0c2a1e">
<link rel="stylesheet" href="./lobby.css">
</head>
<body>
  <header>
    <a class="back" href="../../">← 返回大厅</a>
    <h1>🀄 麻将联机版 <span class="wifi">📶</span></h1>
    <div class="spacer"></div>
    <label class="name-field">昵称 <input id="name-input" type="text" maxlength="12" placeholder="未命名"></label>
    <span id="conn" class="conn connecting" title="连接中…">●</span>
  </header>

  <main id="lobby"></main>

  <!-- name dialog, shown the first time you sit (then saved to localStorage) -->
  <div class="overlay hidden" id="name-overlay">
    <div class="panel">
      <h2>请输入昵称</h2>
      <input id="name-dialog-input" type="text" maxlength="12" placeholder="你的名字">
      <button class="big-btn" id="name-dialog-ok">坐下</button>
    </div>
  </div>

  <!-- game-start banner (placeholder until online play is wired to the RemoteBackend) -->
  <div class="overlay hidden" id="start-overlay">
    <div class="panel">
      <h2>开局！</h2>
      <p id="start-text" class="sub"></p>
      <button class="big-btn" id="start-back">返回大厅</button>
    </div>
  </div>

  <!-- connection lost: either the device is offline (no network) or the server is unreachable
       (maintenance). The message is chosen at show time; a button bails back to the main hub. -->
  <div class="overlay hidden" id="maint-overlay">
    <div class="panel">
      <h2 id="maint-title">🛠️ 服务器维护中</h2>
      <p class="sub" id="maint-msg">服务器正在维护中，马上回来…</p>
      <p class="sub" style="font-size:0.78rem;opacity:0.8;">连接恢复后会自动回到大厅，可继续之前的牌局。</p>
      <button class="big-btn" id="maint-hub">← 返回首页</button>
    </div>
  </div>

  <script type="module" src="./lobby.js"></script>
</body>
</html>
