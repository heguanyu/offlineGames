<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>斗地主 · Dou Dizhu</title>
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<script src="../../app-nav.js"></script>
<link rel="icon" href="../../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2a1e">
<link rel="stylesheet" href="./doudizhu.css">
<!-- Online play is driven by the lobby/server (no local difficulty pick). Mark the page online BEFORE
     first paint so the difficulty start screen never flashes while the deferred module boots. -->
<script>if (new URLSearchParams(location.search).get('online')) document.documentElement.dataset.online = '1';</script>
<style>html[data-online] #start-overlay { display: none !important; }</style>
</head>
<body>
  <!-- nav: a top bar in 3D/desktop, a vertical left rail on phones (like the mahjong games) -->
  <header id="nav">
    <div id="round-info"></div>
    <span class="spacer"></span>
    <button id="mute-btn" type="button">🔊</button>
    <button id="menu-btn" type="button">≡</button>
  </header>

  <div id="table">
    <canvas id="scene"></canvas>

    <!-- cumulative scoreboard, top-right (like the mahjong games) -->
    <div id="scores"></div>

    <!-- per-seat overlays injected by main.js -->
    <div id="overlays"></div>

    <!-- bottom action bar (bidding buttons OR play/pass/hint, swapped by main.js) -->
    <div id="actions" hidden></div>

    <!-- online: turn countdown ring shown over whoever is on the clock (a human's turn only) -->
    <div id="turn-timer" class="turn-timer hidden"><svg viewBox="0 0 36 36"><circle class="tt-bg" cx="18" cy="18" r="16"></circle><circle class="tt-arc" cx="18" cy="18" r="16"></circle></svg><span class="tt-secs"></span></div>
  </div>

  <!-- online: lost-connection banner (the RemoteBackend keeps retrying; we bounce to the lobby if it can't recover) -->
  <div id="reconnect-overlay" class="overlay hidden">
    <div class="panel">
      <h1>🔌 连接断开</h1>
      <p class="sub">正在重新连接服务器…</p>
    </div>
  </div>

  <!-- start screen: difficulty pick -->
  <div id="start-overlay" class="overlay">
    <div class="panel">
      <h1>斗地主</h1>
      <p class="sub">3 人 · 叫分 1/2/3 · 你 vs 两位 AI</p>
      <div class="diff-row" id="diff-row">
        <button class="diff-btn" data-level="0">新手</button>
        <button class="diff-btn sel" data-level="1">普通</button>
        <button class="diff-btn" data-level="2">高手</button>
      </div>
      <button class="act-btn" id="start-btn" style="width:100%;margin-top:8px">开始</button>
    </div>
  </div>

  <!-- result -->
  <div id="result-overlay" class="overlay" hidden>
    <div class="panel">
      <div id="result-title"></div>
      <div id="result-detail"></div>
      <div id="result-score"></div>
      <div class="scorebar" id="result-scorebar"></div>
      <button class="act-btn" id="next-btn" style="width:100%;margin-bottom:10px">再来一局</button>
      <button class="act-btn ghost" id="result-home" style="width:100%">← 返回大厅</button>
    </div>
  </div>

  <!-- menu (≡): Resume / Restart (clear score) / Return to lobby -->
  <div id="menu-overlay" class="overlay" hidden>
    <div class="panel">
      <h1>菜单</h1>
      <button class="act-btn" id="menu-continue" style="width:100%;margin-bottom:10px">继续</button>
      <button class="act-btn no" id="menu-restart" style="width:100%;margin-bottom:10px">重开（清零比分）</button>
      <!-- online only: forfeit the live 场 (your seat becomes a bot; no lifetime score) -->
      <button class="act-btn no" id="menu-forfeit" hidden style="width:100%;margin-bottom:10px">认输并退出</button>
      <button class="act-btn ghost" id="menu-home" style="width:100%">← 返回大厅</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
