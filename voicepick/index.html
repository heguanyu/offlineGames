<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>选声音 · 男声</title>
<style>
  body { margin: 0; padding: 18px 16px 40px; background: #0d1b14; color: #eaf6f0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 1.22rem; margin: 0 0 4px; }
  p.sub { color: #9fd3bf; margin: 0 0 14px; font-size: 0.9rem; line-height: 1.5; }
  h2 { font-size: 1rem; color: #e8c466; border-bottom: 1px solid #2c8160; padding-bottom: 6px; margin: 22px 0 8px; }
  .v { border-bottom: 1px solid #163528; padding: 9px 0; }
  .v b { font-size: 0.98rem; } .v .d { color: #9fd3bf; font-size: 0.8rem; margin: 2px 0 5px; }
  .clip { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .clip span { width: 4.2em; color: #bfe6d8; font-size: 0.8rem; }
  audio { flex: 1; height: 32px; }
  .ok { color: #7ddf8a; }
</style>
</head>
<body>
  <h1>选声音 — 男声对比</h1>
  <p class="sub">女声已定 <span class="ok">✓</span>：年轻女 = <b>fy1</b>，成熟女 = <b>fm1</b>（成熟女将 +30% 语速）。<br>
     男声：之前的预设 <b>Dylan / Uncle_Fu</b> vs 新的 VoiceDesign 候选（按描述生成，已固定种子=声音一致）。<br>
     告诉我年轻男、成熟男各选哪个；“对儿三 / 对三”也可一并定。</p>

  <h2>年轻男（东 / 斗地主你）</h2>
  <div id="young"></div>
  <h2>成熟男（西 / 上家）</h2>
  <div id="mature"></div>
<script>
  const clip = (id, sub, label) => `<div class="clip"><span>${label}</span><audio controls preload="none" src="./${id}_${sub}.wav"></audio></div>`;
  const row = (host, id, desc, subs) => {
    const el = document.createElement('div'); el.className = 'v';
    el.innerHTML = `<b>${id}</b><div class="d">${desc}</div>` + subs.map(([s, l]) => clip(id, s, l)).join('');
    document.getElementById(host).appendChild(el);
  };
  const full = [['line', '整句'], ['dui', '对儿三'], ['dui2', '对三']];
  row('young', 'Dylan', '预设：年轻男，北京腔清亮', [['line', '整句'], ['dui', '对儿三']]);
  row('young', 'my1', 'VoiceDesign：约25岁，明亮有活力', full);
  row('young', 'my2', 'VoiceDesign：年轻，温暖友好、自信', full);
  row('mature', 'Uncle_Fu', '预设：成熟男，低沉醇厚', [['line', '整句'], ['dui', '对儿三']]);
  row('mature', 'mm1', 'VoiceDesign：约45岁，低沉醇厚、沉稳', full);
  row('mature', 'mm2', 'VoiceDesign：中年，磁性低音、从容', full);
</script>
</body>
</html>
