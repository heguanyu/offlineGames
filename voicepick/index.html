<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>选声音 · Kokoro 中文音色试听</title>
<style>
  body { margin: 0; padding: 18px 16px 40px; background: #0d1b14; color: #eaf6f0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p.sub { color: #9fd3bf; margin: 0 0 18px; font-size: 0.9rem; line-height: 1.45; }
  h2 { font-size: 1rem; color: #e8c466; border-bottom: 1px solid #2c8160; padding-bottom: 6px; margin: 22px 0 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #163528; }
  .vid { width: 5.5em; font-weight: 700; font-variant-numeric: tabular-nums; }
  audio { flex: 1; height: 36px; }
  code { background: #12342a; padding: 1px 6px; border-radius: 5px; color: #e8c466; }
</style>
</head>
<body>
  <h1>选声音 — Kokoro 中文音色</h1>
  <p class="sub">每条念的是同一句：<b>“三万，九条。碰！自摸，胡啦！”</b><br>
     请挑：年轻开心男(25)、年轻开心女(25)、成熟稳重男(45)、成熟稳重女(45)。<br>
     斗地主还要 3 个（你 / 下家 / 上家）。把你选中的 <code>voice id</code> 发给我即可。</p>

  <h2>男声 (zm_)</h2>
  <div id="male"></div>
  <h2>女声 (zf_)</h2>
  <div id="female"></div>

<script>
  const zm = ['zm_009','zm_016','zm_025','zm_034','zm_045','zm_055','zm_066','zm_096'];
  const zf = ['zf_001','zf_008','zf_019','zf_028','zf_040','zf_051','zf_070','zf_088'];
  const mk = (host, list) => list.forEach((v) => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<span class="vid">${v}</span><audio controls preload="none" src="./${v}.wav"></audio>`;
    document.getElementById(host).appendChild(r);
  });
  mk('male', zm); mk('female', zf);
</script>
</body>
</html>
