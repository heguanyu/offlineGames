<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>电子书阅读</title>
<link rel="manifest" href="../manifest.webmanifest">
<script src="../app-nav.js"></script>
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1e1e2e">
<link rel="stylesheet" href="./reader.css">
</head>
<body>
  <!-- 书架 (library) -->
  <div id="library">
    <header id="bar">
      <a class="back" href="../" onclick="event.preventDefault(); location.replace('../')" aria-label="返回">‹ 返回</a>
      <h1>电子书</h1>
      <button id="btn-add" type="button">＋ 添加 EPUB</button>
      <input id="file-input" type="file" accept=".epub,application/epub+zip" multiple hidden>
    </header>
    <p id="busy" hidden>正在导入…</p>
    <main id="shelf"></main>
    <p id="empty" class="empty" hidden>书架是空的<br>点右上角「＋ 添加 EPUB」从「文件」导入电子书</p>
  </div>

  <!-- 阅读页 (reader) -->
  <div id="reader" hidden>
    <div id="viewport"><div id="flow" class="flow"></div></div>
    <p id="pageno"></p>
    <div id="gesture"></div>

    <header id="hud-top" class="hud">
      <button class="back" id="btn-shelf" type="button">‹ 书架</button>
      <span id="hud-title"></span>
      <button class="hud-btn" id="btn-toc" type="button">目录</button>
    </header>
    <footer id="hud-bottom" class="hud">
      <button class="hud-btn" id="btn-font-dec" type="button">A−</button>
      <button class="hud-btn" id="btn-font-inc" type="button">A＋</button>
      <span id="hud-info"></span>
      <button class="hud-btn" id="btn-prev-ch" type="button">‹ 章</button>
      <button class="hud-btn" id="btn-next-ch" type="button">章 ›</button>
    </footer>

    <div id="toc-scrim" hidden></div>
    <aside id="toc" hidden>
      <h2>目录</h2>
      <div id="toc-list"></div>
    </aside>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
