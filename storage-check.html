<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Storage Check</title>
<meta name="theme-color" content="#1a1a2e">
<!-- Deliberately self-contained: NO external scripts/styles. This page is a
     recovery/diagnostics tool for the emulator IndexedDB data, and must work
     even when the rest of the cached app shell is stale or broken. It is the
     SAME file on the github.io mirror and the Azure app, so it doubles as a
     cross-origin save migrator: Export on the old origin, Import on the new.
     iOS partitions storage per browsing context (a Home-Screen PWA and a
     Safari tab are SEPARATE containers for the same domain), so open this in
     each context to find which one actually holds your data. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #1a1a2e; color: #eaeaea;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding: max(16px, env(safe-area-inset-top)) 16px 40px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  a.back { color: #8a8aa3; text-decoration: none; font-size: 0.9rem; }
  h1 { font-size: 1.4rem; margin: 10px 0 4px; }
  h2 { font-size: 1.05rem; margin: 22px 0 8px; color: #e9c46a; }
  .ctx { font-size: 0.85rem; color: #8a8aa3; }
  .ctx b { color: #eaeaea; }
  .card {
    background: #16213e; border: 1px solid #2c3a63; border-radius: 12px;
    padding: 12px 14px; margin: 10px 0;
  }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .row .k { color: #8a8aa3; }
  .row .v { text-align: right; font-variant-numeric: tabular-nums; }
  .big { font-size: 1.1rem; font-weight: 600; }
  .ok { color: #2a9d8f; }
  .warn { color: #e9c46a; }
  .bad { color: #e94560; }
  .game { font-size: 0.85rem; color: #cfcfe0; padding: 2px 0 2px 10px; border-left: 2px solid #2c3a63; margin: 4px 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
  button, label.filebtn {
    background: #0f3460; border: 1px solid #2c3a63; border-radius: 10px;
    color: #eaeaea; font-size: 0.95rem; padding: 12px 18px; cursor: pointer; display: inline-block;
  }
  button:active, label.filebtn:active { background: #14457f; }
  label.filebtn input { display: none; }
  #status { font-size: 0.9rem; color: #e9c46a; min-height: 1.3em; margin: 8px 0; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 0.8rem; color: #8a8aa3; }
  .note { font-size: 0.82rem; color: #8a8aa3; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./" onclick="event.preventDefault(); location.replace('./')">&larr; back</a>
  <h1>Storage Check &amp; Save Migrator</h1>
  <p class="ctx" id="ctx"></p>

  <div class="btns">
    <button id="rescan">↻ Rescan</button>
    <button id="export">⬇︎ Export saves to file</button>
    <label class="filebtn">⬆︎ Import saves from file
      <input type="file" id="import" accept=".json,application/json">
    </label>
  </div>
  <p id="status"></p>

  <div id="report"></div>

  <p class="note">
    Export bundles only your in‑game (battery) saves and quick‑save states — NOT the ROM
    files (those are large; re‑add them yourself). To migrate: open this page on the origin that
    HAS your data, tap Export, then open it on the new origin and tap Import.
  </p>
</div>

<script>
  // Systems we know about; both use the same IndexedDB layout the emulator pages create.
  const SYSTEMS = [
    { system: 'gba', dbName: 'gba-library' },
    { system: 'nds', dbName: 'nds-library' },
  ];
  const ALL_STORES = ['roms', 'states', 'settings', 'saves'];

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const setStatus = (m, cls) => { statusEl.textContent = m; statusEl.className = ''; if (cls) statusEl.classList.add(cls); };

  function fmtBytes(b) {
    if (!b) return '0';
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b >= 1024) return Math.round(b / 1024) + ' KB';
    return b + ' B';
  }
  function sizeOf(v) {
    if (!v) return 0;
    if (typeof v.size === 'number') return v.size;             // Blob / File (ROMs)
    if (typeof v.byteLength === 'number') return v.byteLength; // ArrayBuffer / TypedArray
    if (v.data) return sizeOf(v.data);                          // {data: ...} row
    return 0;
  }

  // base64 <-> bytes, chunked to dodge the apply() arg-count limit on multi-MB states.
  function u8ToB64(u8) {
    let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function b64ToU8(b64) {
    const s = atob(b64); const u8 = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
    return u8;
  }
  const toU8 = (d) => d instanceof Uint8Array ? d : new Uint8Array(d);

  // Open whatever version already exists on disk (no upgrade) — read-only inspection.
  // Resolves null if the DB does not exist (or the open is blocked).
  function openExisting(name) {
    return new Promise((resolve) => {
      let req;
      try { req = indexedDB.open(name); } catch (e) { return resolve(null); }
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);
    });
  }

  // Open for writing, creating the emulator's stores if the DB is new/empty (matches the app).
  function openForWrite(name) {
    return new Promise((resolve, reject) => {
      // First read the current version so we can bump it if stores are missing.
      const probe = indexedDB.open(name);
      probe.onsuccess = () => {
        const db = probe.result;
        const missing = ALL_STORES.some((s) => !db.objectStoreNames.contains(s));
        const ver = db.version;
        db.close();
        if (!missing) { const r = indexedDB.open(name); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); return; }
        const up = indexedDB.open(name, ver + 1);
        up.onupgradeneeded = () => {
          const d = up.result;
          if (!d.objectStoreNames.contains('roms')) d.createObjectStore('roms', { keyPath: 'name' });
          if (!d.objectStoreNames.contains('states')) d.createObjectStore('states', { keyPath: 'key' });
          if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
          if (!d.objectStoreNames.contains('saves')) d.createObjectStore('saves', { keyPath: 'key' });
        };
        up.onsuccess = () => resolve(up.result);
        up.onerror = () => reject(up.error);
      };
      probe.onerror = () => reject(probe.error);
    });
  }

  function getAll(db, store) {
    return new Promise((resolve) => {
      if (!db.objectStoreNames.contains(store)) return resolve([]);
      const req = db.transaction(store, 'readonly').objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  }

  async function scan() {
    setStatus('Scanning…');
    const report = $('report');
    report.textContent = '';

    // --- Context (which partition are we in?) ---
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    $('ctx').innerHTML = 'Origin: <b>' + location.origin + '</b><br>'
      + 'Context: <b>' + (standalone ? 'installed app (Home-Screen PWA)' : 'browser tab') + '</b>';

    // --- Overall storage estimate ---
    let est = null;
    try { if (navigator.storage && navigator.storage.estimate) est = await navigator.storage.estimate(); } catch (e) { /* unsupported */ }
    const estCard = document.createElement('div');
    estCard.className = 'card';
    estCard.innerHTML = '<div class="row"><span class="k">Total storage used (this context)</span>'
      + '<span class="v big">' + (est ? fmtBytes(est.usage) : 'n/a') + '</span></div>'
      + (est ? '<div class="row"><span class="k">Quota</span><span class="v">' + fmtBytes(est.quota) + '</span></div>' : '');
    report.appendChild(estCard);

    // --- Databases present ---
    let dbList = null;
    try { if (indexedDB.databases) dbList = await indexedDB.databases(); } catch (e) { /* unsupported */ }
    if (dbList) {
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = '<div class="row"><span class="k">IndexedDB databases here</span><span class="v">'
        + (dbList.length ? dbList.map((d) => d.name).join(', ') : '<span class="bad">none</span>') + '</span></div>';
      report.appendChild(c);
    }

    // --- Per-system detail ---
    let foundAnything = false;
    for (const { system, dbName } of SYSTEMS) {
      const db = await openExisting(dbName);
      const c = document.createElement('div'); c.className = 'card';
      const head = document.createElement('div'); head.className = 'row';
      head.innerHTML = '<span class="k big">' + system.toUpperCase() + ' &middot; ' + dbName + '</span>';
      c.appendChild(head);

      if (!db || !db.objectStoreNames.contains('roms')) {
        const r = document.createElement('div'); r.className = 'row';
        r.innerHTML = '<span class="k">status</span><span class="v bad">not present in this context</span>';
        c.appendChild(r);
        report.appendChild(c);
        if (db) db.close();
        continue;
      }

      const roms = await getAll(db, 'roms');
      const saves = await getAll(db, 'saves');
      const states = await getAll(db, 'states');
      db.close();

      const romBytes = roms.reduce((n, r) => n + sizeOf(r.data), 0);
      const saveBytes = saves.reduce((n, r) => n + sizeOf(r), 0);
      const stateBytes = states.reduce((n, r) => n + sizeOf(r), 0);
      if (roms.length || saves.length || states.length) foundAnything = true;

      const mkRow = (k, v, cls) => '<div class="row"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>';
      c.innerHTML += mkRow('ROM files', roms.length + ' (' + fmtBytes(romBytes) + ')', roms.length ? 'ok' : 'warn');
      c.innerHTML += mkRow('In-game (battery) saves', saves.length + ' (' + fmtBytes(saveBytes) + ')', saves.length ? 'ok' : '');
      c.innerHTML += mkRow('Quick-save states', states.length + ' (' + fmtBytes(stateBytes) + ')', states.length ? 'ok' : '');

      // Per-game breakdown of what we'd migrate.
      const games = new Set([...saves.map((s) => s.game), ...states.map((s) => s.game)]);
      for (const g of games) {
        const nS = states.filter((s) => s.game === g).length;
        const hasB = saves.some((s) => s.game === g);
        const el = document.createElement('div'); el.className = 'game';
        el.textContent = '• ' + g + ' — ' + (hasB ? 'battery save' : 'no battery save') + (nS ? ', ' + nS + ' quick state(s)' : '');
        c.appendChild(el);
      }
      report.appendChild(c);
    }

    // --- The persistent client id (cloud-save key) ---
    const idDb = await openExisting('client-id');
    let uid = localStorage.getItem('mahjong-online-uid') || null;
    if (idDb && idDb.objectStoreNames.contains('kv')) {
      const rows = await getAll(idDb, 'kv');
      const row = rows.find((r) => r.k === 'uid');
      if (row && row.v) uid = row.v;
      idDb.close();
    }
    const idCard = document.createElement('div'); idCard.className = 'card';
    idCard.innerHTML = '<div class="row"><span class="k">Backup ID (cloud-save key)</span></div>'
      + '<pre>' + (uid || '(none yet)') + '</pre>';
    report.appendChild(idCard);

    setStatus(foundAnything ? 'Found emulator data in THIS context — tap Export to back it up.'
      : 'No emulator saves/ROMs in this context. Try opening this page from the OLD installed app instead.',
      foundAnything ? 'ok' : 'warn');
  }

  async function exportSaves() {
    setStatus('Reading saves…');
    const bundle = { v: 1, origin: location.origin, ts: Date.now(), systems: {} };
    let total = 0;
    for (const { system, dbName } of SYSTEMS) {
      const db = await openExisting(dbName);
      if (!db) continue;
      const saves = await getAll(db, 'saves');
      const states = await getAll(db, 'states');
      db.close();
      const games = {};
      for (const s of saves) {
        if (!s.data) continue;
        (games[s.game] = games[s.game] || { battery: null, states: [] }).battery = u8ToB64(toU8(s.data));
        total++;
      }
      for (const s of states) {
        if (!s.data) continue;
        (games[s.game] = games[s.game] || { battery: null, states: [] }).states.push(
          { slot: s.slot, variant: s.variant ?? null, data: u8ToB64(toU8(s.data)) });
        total++;
      }
      const arr = Object.entries(games).map(([game, v]) => ({ game, battery: v.battery, states: v.states }));
      if (arr.length) bundle.systems[system] = arr;
    }
    if (!total) { setStatus('Nothing to export in this context.', 'warn'); return; }
    const blob = new Blob([JSON.stringify(bundle)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'offlinegames-saves-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus('Exported ' + total + ' save item(s). Save the file to the Files app, then Import it on the new site.', 'ok');
  }

  async function importSaves(file) {
    setStatus('Reading file…');
    let bundle;
    try { bundle = JSON.parse(await file.text()); } catch (e) { setStatus('Not a valid backup file.', 'bad'); return; }
    if (!bundle || !bundle.systems) { setStatus('Unrecognised backup file.', 'bad'); return; }
    let written = 0;
    for (const { system, dbName } of SYSTEMS) {
      const games = bundle.systems[system];
      if (!games || !games.length) continue;
      const db = await openForWrite(dbName);
      await new Promise((resolve, reject) => {
        const t = db.transaction(['saves', 'states'], 'readwrite');
        const savesStore = t.objectStore('saves');
        const statesStore = t.objectStore('states');
        for (const g of games) {
          if (g.battery) { savesStore.put({ key: g.game, game: g.game, data: b64ToU8(g.battery) }); written++; }
          for (const s of (g.states || [])) {
            const slot = String(s.slot || 1);
            statesStore.put({ key: g.game + '|' + slot, slot, game: g.game, variant: s.variant ?? null, data: b64ToU8(s.data) });
            written++;
          }
        }
        t.oncomplete = resolve;
        t.onerror = () => reject(t.error);
      });
      db.close();
    }
    setStatus(written ? 'Imported ' + written + ' save item(s). Re-add the ROM files, then open each game to load its save.' : 'File had no saves to import.', written ? 'ok' : 'warn');
    scan();
  }

  $('rescan').onclick = scan;
  $('export').onclick = () => exportSaves().catch((e) => setStatus('Export failed: ' + e.message, 'bad'));
  $('import').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importSaves(f).catch((err) => setStatus('Import failed: ' + err.message, 'bad')); };

  scan().catch((e) => setStatus('Scan failed: ' + e.message, 'bad'));
</script>
</body>
</html>
