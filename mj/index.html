<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天津麻将</title>
<!-- 天津麻将 SUB-HUB — a shareable, scoped entry (not linked from the main hub): only this game,
     offline + 联机 (the 联机版 joins the SAME server/tables as the full site). It registers its
     OWN service worker (/sw-mj.js, generated by tools/gen-subhub.js from sw.js) whose precache
     is just the mahjong subset — visitors here never download the rest of the arcade. The page
     plants the hub-home marker so every in-game 返回大厅 lands back HERE (see shared/hub-home.js). -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<script src="../app-nav.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
    min-height: 100vh; background: radial-gradient(circle at 50% 20%, #17213f, #0b1020 70%);
    color: #e8e8f0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  h1 { margin: 0; font-size: 1.9rem; letter-spacing: 0.08em; }
  .sub { margin: -14px 0 0; color: #9a9ab3; font-size: 0.9rem; }
  .cards { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .card {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 168px; height: 138px; gap: 8px; border-radius: 20px; text-decoration: none; color: #e8e8f0;
    background: #171c2c; border: 1px solid #2c3a63; font-size: 1.02rem; font-weight: 600;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
  }
  .card:active { background: #1b2545; transform: scale(0.97); }
  .card .emoji { font-size: 2.3rem; }
  .card .wifi { position: absolute; top: 8px; right: 10px; font-size: 1rem; }
  #ver { color: #5a627e; font-size: 0.72rem; margin: 0; }
</style>
</head>
<body>
  <h1>🀄 天津麻将</h1>
  <p class="sub">离线单机 · 或与朋友联机对战</p>
  <nav class="cards">
    <a class="card" href="../games/mahjong-tianjin/">
      <span class="emoji">🀄</span>
      <span>单机 · 对战 AI</span>
    </a>
    <a class="card" href="../games/mahjong-common-online/?game=tianjin">
      <span class="wifi" aria-hidden="true">📶</span>
      <span class="emoji">🀄</span>
      <span>联机对战</span>
    </a>
  </nav>
  <p id="ver"></p>
  <script>
    // Mark THIS page as "home": the games' 返回大厅/主页 buttons come back here (shared/hub-home.js).
    try { sessionStorage.setItem('hub-home', new URL('.', location.href).pathname); } catch {}
    // Own scoped service worker (mahjong-only precache). Script lives at the site root so its
    // scope covers the game pages under /games/ too.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw-mj.js', { updateViaCache: 'none' }).catch(() => {});
    }
    fetch('../sw-mj.js').then((r) => r.text()).then((t) => {
      const m = t.match(/mj-hub-([0-9.]+)/);
      if (m) document.getElementById('ver').textContent = 'v' + m[1];
    }).catch(() => {});
  </script>
</body>
</html>
