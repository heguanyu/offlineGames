name: Build vbam core

# Builds the VBA-M (vbam) libretro core to WebAssembly using EmulatorJS's
# build pipeline, on a GitHub-hosted Linux runner. Results + full logs are
# committed to the `core-build` branch for retrieval (no gh CLI needed).
# Re-trigger by pushing a change to this file, or via the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-vbam.yml'

permissions:
  contents: write

jobs:
  build-vbam:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Heartbeat — signal start on core-build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B core-build
          rm -rf core-build-artifacts
          mkdir -p core-build-artifacts
          echo "STARTED $(date -u) run=${GITHUB_RUN_ID}" > core-build-artifacts/STATUS.txt
          git add -A core-build-artifacts
          git commit -m "vbam build: started [skip ci]"
          git push -f origin core-build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full binutils-mips-linux-gnu build-essential \
            pkgconf python3 git zip libsdl2-dev jq wget curl patch cmake

      - name: Install Emscripten 3.1.74
        run: |
          cd "$HOME"
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.74
          ./emsdk activate 3.1.74

      - name: Build vbam
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source "$HOME/emsdk/emsdk_env.sh"
          cd "$HOME"
          git clone --depth 1 https://github.com/EmulatorJS/build.git ejs-build
          cd ejs-build
          # Build vbam from the ACTUAL VBA-M project (visualboyadvance-m),
          # which is what the user's working standalone 2.2.3 is built from —
          # NOT the older/divergent libretro/vbam-libretro fork. Its libretro
          # Makefile is also at src/libretro with an emscripten branch.
          jq '. += [{"name":"vbam","extensions":["gb","gbc","gba"],"makeoptions":{"buildpath":"src/libretro","makescript":"Makefile","arguments":[]},"options":{},"save":"srm","license":"doc/License.txt","repo":"https://github.com/visualboyadvance-m/visualboyadvance-m"}]' cores.json > cores.tmp && mv cores.tmp cores.json
          echo "=== build 1: clone + build vbam (unpatched) ==="
          bash build.sh --core=vbam 2>&1 | tee "$HOME/vbam-build.log"
          # Force 64K flash. The Emerald 386 bootleg declares FLASH1M_ (128K),
          # so the libretro wrapper's load_image_preferences() auto-detects 128K
          # and the in-game save fails — but it saves correctly as 64K (matches
          # the user's working VBA-M "Flash Size = 64K" setting). Patch the
          # FLASH1M_ autodetect branch in libretro.cpp to use 64K (SIZE_FLASH512).
          LR=$(find "$HOME/ejs-build/compile" -path '*vbam*/src/libretro/libretro.cpp' 2>/dev/null | head -1)
          echo "=== libretro.cpp located at: $LR ===" | tee -a "$HOME/vbam-build.log"
          if [ -n "$LR" ]; then
            echo "before:" | tee -a "$HOME/vbam-build.log"; grep -n "saveSize = SIZE_FLASH1M;" "$LR" | tee -a "$HOME/vbam-build.log"
            sed -i 's/saveSize = SIZE_FLASH1M;/saveSize = SIZE_FLASH512;/' "$LR"
            echo "after:" | tee -a "$HOME/vbam-build.log"; grep -n "saveSize = SIZE_FLASH512;" "$LR" | tee -a "$HOME/vbam-build.log"
          else
            echo "!!! libretro.cpp NOT FOUND under compile/ !!!" | tee -a "$HOME/vbam-build.log"
          fi
          echo "=== build 2: rebuild vbam with forced-64K patch ==="
          bash build.sh --core=vbam 2>&1 | tee -a "$HOME/vbam-build.log"
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Collect results to core-build branch
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p core-build-artifacts/output
          cp -r "$HOME"/ejs-build/output/* core-build-artifacts/output/ 2>/dev/null || true
          cp "$HOME"/vbam-build.log core-build-artifacts/ 2>/dev/null || true
          {
            echo "FINISHED $(date -u) run=${GITHUB_RUN_ID}"
            echo "build exit code: ${BUILD_EXIT:-unknown}"
            echo ""
            echo "=== output files ==="
            (cd core-build-artifacts && find output -type f 2>/dev/null | sort) || echo "(none)"
            echo ""
            echo "=== last 80 log lines ==="
            tail -80 "$HOME/vbam-build.log" 2>/dev/null || echo "(no log)"
          } > core-build-artifacts/STATUS.txt
          git add -A core-build-artifacts
          git commit -m "vbam build: results (exit ${BUILD_EXIT:-?}) [skip ci]" || echo "nothing to commit"
          git push -f origin core-build
