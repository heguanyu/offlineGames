name: Deploy to GitHub Pages

# The app is pure static files (no build step) — this workflow just packages
# the repo and publishes it to Pages, bypassing the legacy Jekyll branch build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight deploy at a time; newer pushes supersede older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root. ROMs are git-ignored so they're never published;
          # the test/ scripts are harmless static files.
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
