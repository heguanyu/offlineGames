# Deploy the online 天津麻将 server (server/) to the Azure Web App "mahjongonline".
#
# The server imports games/mahjong-tianjin/{engine,ai}.js (outside server/), so we STAGE a
# self-contained package: server/{index,table,db}.js + those two engine files + a type:module
# package.json whose start script runs `node server/index.js`. Deps: `ws` and `better-sqlite3`
# (the score database — its data lives on the persistent /home mount, set via SCORES_FILE). Auth is
# OIDC (azure/login) — the publish-profile path is dead (SCM Basic Auth disabled on the app).
name: Build and deploy Node.js app to Azure Web App - mahjongonline

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'games/mahjong-tianjin/engine.js'
      - 'games/mahjong-tianjin/ai.js'
      - '.github/workflows/main_mahjongonline.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for the OIDC token azure/login requests
  contents: read    # required for actions/checkout

concurrency:
  group: deploy-mahjongonline
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Stage a self-contained server package
        run: |
          mkdir -p _deploy/server _deploy/games/mahjong-tianjin
          cp server/index.js server/table.js server/db.js _deploy/server/
          cp games/mahjong-tianjin/engine.js games/mahjong-tianjin/ai.js _deploy/games/mahjong-tianjin/
          echo '{"name":"mahjong-online-deploy","private":true,"type":"module","engines":{"node":">=20"},"scripts":{"start":"node server/index.js"},"dependencies":{"ws":"^8.18.0","better-sqlite3":"^11.10.0"}}' > _deploy/package.json

      - name: Install production dependencies
        working-directory: _deploy
        run: npm install --omit=dev --no-audit --no-fund

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_15791C509140470EA89AB6CA26E26AAD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E136FF2A3910415FA62D0C1F56903DDA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F5E84AA309934630AD0F03621E1CEDD1 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mahjongonline'
          slot-name: 'Production'
          package: _deploy
