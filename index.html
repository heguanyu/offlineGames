<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Offline Games</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a1a2e">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #1a1a2e;
    color: #eaeaea;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px 24px;
  }
  h1 { font-size: 2rem; margin-bottom: 4px; }
  #meta { font-size: 0.85rem; color: #8a8aa3; margin-bottom: 32px; }
  #net-status.offline { color: #e9c46a; }
  #update-btn {
    font: inherit; font-size: 0.78rem; line-height: 1;
    color: #9fb4ff; background: none; border: 1px solid #2c3a63;
    border-radius: 999px; padding: 3px 11px; margin-left: 10px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; vertical-align: middle;
  }
  #update-btn:active:not(:disabled) { background: #0f3460; }
  #update-btn:disabled { color: #5a5a78; border-color: #232f52; cursor: default; }
  .cat-section { width: 100%; max-width: 820px; margin-bottom: 30px; }
  .cat-title {
    font-size: 1.05rem; color: #b9b9d6; font-weight: 600; letter-spacing: 0.04em;
    text-align: center; margin-bottom: 14px;
    padding-bottom: 8px; border-bottom: 1px solid #2c3a63;
  }
  nav { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 180px;
    height: 130px;
    background: #16213e;
    border: 1px solid #2c3a63;
    border-radius: 14px;
    text-decoration: none;
    color: #eaeaea;
    font-size: 1rem;
  }
  .card:active { background: #0f3460; }
  .card .emoji { font-size: 2.4rem; margin-bottom: 10px; }
</style>
</head>
<body>
  <h1>Offline Games</h1>
  <p id="meta"><span id="app-version"></span><span id="net-status"></span><button id="update-btn" type="button" hidden>Check for updates</button></p>
  <section class="cat-section">
    <h2 class="cat-title">🕹️ Emulator Games</h2>
    <nav>
      <a class="card" href="./games/gba/?core=mgba">
        <span class="emoji">👾</span>
        GBA · mGBA
      </a>
      <a class="card" href="./games/gba/?core=vbam">
        <span class="emoji">👾</span>
        GBA · VBA-M
      </a>
      <a class="card" href="./games/nds/">
        <span class="emoji">🎴</span>
        Nintendo DS
      </a>
    </nav>
  </section>

  <section class="cat-section">
    <h2 class="cat-title">🀄 麻将 Mahjong</h2>
    <nav>
      <a class="card" href="./games/mahjong/">
        <span class="emoji">🀄</span>
        天津麻将
      </a>
      <a class="card" href="./games/guobiao/">
        <span class="emoji">🀅</span>
        国标麻将
      </a>
      <a class="card" href="./games/guobiao-free/">
        <span class="emoji">🀆</span>
        国标（无定番）
      </a>
    </nav>
  </section>

  <section class="cat-section">
    <h2 class="cat-title">🛠️ Tools</h2>
    <nav>
      <a class="card" href="./games/pad-test/">
        <span class="emoji">🎮</span>
        Controller Test
      </a>
    </nav>
  </section>
  <script>
    const statusEl = document.getElementById('net-status');
    const btn = document.getElementById('update-btn');
    const swSupported = 'serviceWorker' in navigator;

    let swReg = null;       // the service-worker registration
    let busy = false;       // a check is currently running
    let updating = false;   // a new version is installing → reload when it takes over
    let reloaded = false;   // guard so we reload at most once

    if (swSupported) {
      btn.hidden = false;
      // updateViaCache:'none' → reg.update() always re-fetches sw.js from the
      // network, so a fresh deploy is detected even behind HTTP caching.
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then((r) => { swReg = r; })
        .catch(() => {});
      // sw.js skipWaiting()s + claims, so a new worker activates immediately.
      // When it takes control after a user-initiated update, reload to run the
      // fresh assets. (Gated on `updating` so the first visit's claim won't reload.)
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updating && !reloaded) { reloaded = true; location.reload(); }
      });
    }

    // Button label/enabled state for each phase.
    const BTN = {
      idle:     ['Check for updates', false],
      offline:  ['Check for updates', true],
      checking: ['Checking…',         true],
      updating: ['Updating…',         true],
      current:  ['✓ Up to date',      true],
      error:    ['⚠ Retry',           false],
    };
    function setBtn(state) {
      const [text, disabled] = BTN[state] || BTN.idle;
      btn.textContent = text;
      btn.disabled = disabled;
    }

    function updateNetStatus() {
      const online = navigator.onLine;
      statusEl.textContent = online ? 'online' : 'offline — running from cache';
      statusEl.classList.toggle('offline', !online);
      if (swSupported && !busy && !updating) setBtn(online ? 'idle' : 'offline');
    }
    addEventListener('online', updateNetStatus);
    addEventListener('offline', updateNetStatus);

    async function checkForUpdate() {
      if (busy || updating || !navigator.onLine) return;
      busy = true; setBtn('checking');
      try {
        swReg = swReg || await navigator.serviceWorker.getRegistration();
        if (!swReg) throw new Error('no service-worker registration');
        await swReg.update();                          // network re-check of sw.js
        const incoming = swReg.installing || swReg.waiting;
        if (!incoming) {                               // byte-identical → nothing new
          busy = false; setBtn('current');
          setTimeout(updateNetStatus, 3000);
          return;
        }
        updating = true; setBtn('updating');           // new version downloading
        const onState = () => {
          if (incoming.state === 'activated' && !reloaded) { reloaded = true; location.reload(); }
          else if (incoming.state === 'redundant') { updating = false; busy = false; setBtn('error'); }
        };
        incoming.addEventListener('statechange', onState);
        onState();                                     // in case it already advanced
      } catch {
        busy = false; setBtn('error');
      }
    }
    btn.addEventListener('click', checkForUpdate);

    updateNetStatus();

    // The version lives in sw.js's cache name; parse it so it can't drift.
    fetch('./sw.js')
      .then((r) => r.text())
      .then((t) => {
        const m = t.match(/offline-games-(\d+\.\d+\.\d+)/);
        if (m) document.getElementById('app-version').textContent = 'v' + m[1] + ' · ';
      })
      .catch(() => {});
  </script>
</body>
</html>
