<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>离线游戏</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a1a2e">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #1a1a2e;
    color: #eaeaea;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px 24px;
  }
  h1 { font-size: 2rem; margin-bottom: 4px; }
  #meta { font-size: 0.85rem; color: #8a8aa3; margin-bottom: 32px; }
  #net-status.offline { color: #e9c46a; }
  #update-btn {
    font: inherit; font-size: 0.78rem; line-height: 1;
    color: #9fb4ff; background: none; border: 1px solid #2c3a63;
    border-radius: 999px; padding: 3px 11px; margin-left: 10px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; vertical-align: middle;
  }
  #update-btn:active:not(:disabled) { background: #0f3460; }
  #update-btn:disabled { color: #5a5a78; border-color: #232f52; cursor: default; }
  /* "Add to Home Screen" helper (iOS/iPadOS Safari has no install API → we guide instead) */
  #install-btn {
    font: inherit; font-size: 0.78rem; line-height: 1;
    color: #9fb4ff; background: none; border: 1px solid #2c3a63;
    border-radius: 999px; padding: 3px 11px; margin-left: 10px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; vertical-align: middle;
  }
  #install-btn:active { background: #0f3460; }
  #install-overlay {
    position: fixed; inset: 0; z-index: 20; padding: 24px;
    background: rgba(10, 10, 20, 0.72);
    display: flex; align-items: center; justify-content: center;
  }
  #install-overlay[hidden] { display: none; }
  .install-card {
    background: #16213e; border: 1px solid #2c3a63; border-radius: 16px;
    max-width: 380px; width: 100%; padding: 24px 22px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  }
  .install-card h3 { font-size: 1.15rem; margin-bottom: 18px; text-align: center; }
  .install-steps { list-style: none; display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
  .install-steps li { display: flex; align-items: center; gap: 11px; font-size: 0.95rem; line-height: 1.35; }
  .install-steps .num {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: #0f3460; color: #9fb4ff; font-size: 0.85rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .share-ico { flex: none; width: 18px; height: 23px; }
  #install-note { font-size: 0.82rem; color: #e9c46a; margin: -4px 0 16px; text-align: center; }
  #install-close {
    display: block; width: 100%; font: inherit; font-size: 0.95rem;
    color: #eaeaea; background: #0f3460; border: none; border-radius: 10px;
    padding: 11px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #install-close:active { background: #14438a; }
  /* language picker, pinned top-right */
  #lang-picker {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; z-index: 10;
    font: inherit; font-size: 0.85rem; color: #eaeaea; background: #16213e;
    border: 1px solid #2c3a63; border-radius: 8px; padding: 5px 9px; cursor: pointer;
  }
  .cat-section { width: 100%; max-width: 820px; margin-bottom: 30px; }
  .cat-title {
    font-size: 1.05rem; color: #b9b9d6; font-weight: 600; letter-spacing: 0.04em;
    text-align: center; margin-bottom: 14px;
    padding-bottom: 8px; border-bottom: 1px solid #2c3a63;
  }
  nav { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 180px;
    height: 130px;
    background: #16213e;
    border: 1px solid #2c3a63;
    border-radius: 14px;
    text-decoration: none;
    color: #eaeaea;
    font-size: 1rem;
    text-align: center;
  }
  .card:active { background: #0f3460; }
  .card .emoji { font-size: 2.4rem; margin-bottom: 10px; }
</style>
</head>
<body>
  <select id="lang-picker" aria-label="Language">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
  <h1 data-i18n="title">离线游戏</h1>
  <p id="meta"><span id="app-version"></span><span id="net-status"></span><button id="update-btn" type="button" hidden></button><button id="install-btn" type="button" data-i18n="install_btn" hidden></button></p>

  <div id="install-overlay" hidden>
    <div class="install-card" role="dialog" aria-modal="true" aria-labelledby="install-title">
      <h3 id="install-title" data-i18n="install_title">添加到 iPad 主屏幕</h3>
      <ol class="install-steps">
        <li><span class="num">1</span><span data-i18n="install_s1">点按 Safari 的「分享」按钮</span><svg class="share-ico" viewBox="0 0 50 50" fill="none" stroke="#9fb4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M25 4 V31 M16 13 L25 4 L34 13"/><path d="M14 21 H10 a4 4 0 0 0 -4 4 V42 a4 4 0 0 0 4 4 H40 a4 4 0 0 0 4 -4 V25 a4 4 0 0 0 -4 -4 H36"/></svg></li>
        <li><span class="num">2</span><span data-i18n="install_s2">选择「添加到主屏幕」</span></li>
        <li><span class="num">3</span><span data-i18n="install_s3">点按右上角「添加」</span></li>
      </ol>
      <p id="install-note" data-i18n="install_note" hidden>请先用 Safari 浏览器打开本页面</p>
      <button id="install-close" type="button" data-i18n="install_close">知道了</button>
    </div>
  </div>
  <section class="cat-section">
    <h2 class="cat-title" data-i18n="cat-emulator">🕹️ 模拟器游戏</h2>
    <nav>
      <a class="card" href="./games/gba/?core=mgba">
        <span class="emoji">👾</span>
        <span data-i18n="card-gba-mgba">GBA · mGBA</span>
      </a>
      <a class="card" href="./games/gba/?core=vbam">
        <span class="emoji">👾</span>
        <span data-i18n="card-gba-vbam">GBA · VBA-M</span>
      </a>
      <a class="card" href="./games/nds/">
        <span class="emoji">🎴</span>
        <span data-i18n="card-nds">任天堂 DS</span>
      </a>
    </nav>
  </section>

  <section class="cat-section">
    <h2 class="cat-title" data-i18n="cat-mahjong">🀄 麻将</h2>
    <nav>
      <a class="card" href="./games/mahjong/">
        <span class="emoji">🀄</span>
        <span data-i18n="card-tianjin">天津麻将</span>
      </a>
      <a class="card" href="./games/guobiao/">
        <span class="emoji">🀅</span>
        <span data-i18n="card-guobiao">国标麻将</span>
      </a>
      <a class="card" href="./games/guobiao-free/">
        <span class="emoji">🀆</span>
        <span data-i18n="card-guobiao-free">国标（无定番）</span>
      </a>
    </nav>
  </section>

  <section class="cat-section">
    <h2 class="cat-title" data-i18n="cat-tools">🛠️ 工具</h2>
    <nav>
      <a class="card" href="./games/pad-test/">
        <span class="emoji">🎮</span>
        <span data-i18n="card-pad">手柄测试</span>
      </a>
    </nav>
  </section>
  <script>
    // ---- internationalization (hub only) — default Chinese, choice persisted ----
    const I18N = {
      zh: {
        title: '离线游戏',
        'cat-emulator': '🕹️ 模拟器游戏', 'cat-mahjong': '🀄 麻将', 'cat-tools': '🛠️ 工具',
        'card-gba-mgba': 'GBA · mGBA', 'card-gba-vbam': 'GBA · VBA-M', 'card-nds': '任天堂 DS',
        'card-tianjin': '天津麻将', 'card-guobiao': '国标麻将', 'card-guobiao-free': '国标（无定番）',
        'card-pad': '手柄测试',
        online: '在线', offline: '离线 · 使用缓存运行',
        btn_idle: '检查更新', btn_checking: '检查中…', btn_updating: '更新中…',
        btn_current: '✓ 已是最新', btn_error: '⚠ 重试',
        install_btn: '📲 添加到主屏幕',
        install_title: '添加到 iPad 主屏幕',
        install_s1: '点按 Safari 的「分享」按钮',
        install_s2: '在菜单中选择「添加到主屏幕」',
        install_s3: '点按右上角「添加」即可',
        install_note: '请先用 Safari 浏览器打开本页面',
        install_close: '知道了',
      },
      en: {
        title: 'Offline Games',
        'cat-emulator': '🕹️ Emulator Games', 'cat-mahjong': '🀄 Mahjong', 'cat-tools': '🛠️ Tools',
        'card-gba-mgba': 'GBA · mGBA', 'card-gba-vbam': 'GBA · VBA-M', 'card-nds': 'Nintendo DS',
        'card-tianjin': 'Tianjin Mahjong', 'card-guobiao': 'Guobiao (MCR)', 'card-guobiao-free': 'Guobiao (no minimum)',
        'card-pad': 'Controller Test',
        online: 'online', offline: 'offline — running from cache',
        btn_idle: 'Check for updates', btn_checking: 'Checking…', btn_updating: 'Updating…',
        btn_current: '✓ Up to date', btn_error: '⚠ Retry',
        install_btn: '📲 Add to Home Screen',
        install_title: 'Add to your Home Screen',
        install_s1: 'Tap Safari’s Share button',
        install_s2: 'Choose “Add to Home Screen”',
        install_s3: 'Tap “Add” in the top corner',
        install_note: 'Please open this page in Safari first',
        install_close: 'Got it',
      },
    };
    let lang = (() => { try { return localStorage.getItem('hub-lang'); } catch { return null; } })();
    if (!I18N[lang]) lang = 'zh';
    const t = (k) => I18N[lang][k];

    const picker = document.getElementById('lang-picker');
    const statusEl = document.getElementById('net-status');
    const btn = document.getElementById('update-btn');
    const swSupported = 'serviceWorker' in navigator;

    let swReg = null;       // the service-worker registration
    let busy = false;       // a check is currently running
    let updating = false;   // a new version is installing → reload when it takes over
    let reloaded = false;   // guard so we reload at most once
    let btnState = 'idle';  // current update-button phase, so a language switch can re-label it

    const reloadOnce = () => { if (!reloaded) { reloaded = true; location.reload(); } };

    if (swSupported) {
      btn.hidden = false;
      // updateViaCache:'none' → reg.update() always re-fetches sw.js from the
      // network, so a fresh deploy is detected even behind HTTP caching.
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then((r) => { swReg = r; })
        .catch(() => {});
      // sw.js skipWaiting()s + claims, so a new worker activates immediately.
      // When it takes control after a user-initiated update, reload to run the
      // fresh assets. (Gated on `updating` so the first visit's claim won't reload.)
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updating) reloadOnce();
        else showVersion(); // a worker took control without us reloading → refresh the tag
      });
    }

    // Update-button phase → [i18n key, disabled]. Text is resolved through the dict
    // so it re-localizes when the language changes.
    const BTN = {
      idle:     ['btn_idle',     false],
      offline:  ['btn_idle',     true],
      checking: ['btn_checking', true],
      updating: ['btn_updating', true],
      current:  ['btn_current',  true],
      error:    ['btn_error',    false],
    };
    function setBtn(state) {
      btnState = state;
      const [key, disabled] = BTN[state] || BTN.idle;
      btn.textContent = t(key);
      btn.disabled = disabled;
    }

    function updateNetStatus() {
      const online = navigator.onLine;
      statusEl.textContent = online ? t('online') : t('offline');
      statusEl.classList.toggle('offline', !online);
      if (swSupported && !busy && !updating) setBtn(online ? 'idle' : 'offline');
    }
    addEventListener('online', updateNetStatus);
    addEventListener('offline', updateNetStatus);

    // Apply a language to all [data-i18n] nodes + the dynamic status/button, persist it.
    function applyLang(l) {
      lang = I18N[l] ? l : 'zh';
      document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
      document.title = t('title');
      for (const el of document.querySelectorAll('[data-i18n]')) {
        const v = t(el.dataset.i18n); if (v != null) el.textContent = v;
      }
      picker.value = lang;
      setBtn(btnState);                                              // re-label without changing phase
      statusEl.textContent = navigator.onLine ? t('online') : t('offline');
      try { localStorage.setItem('hub-lang', lang); } catch {}
    }
    picker.addEventListener('change', () => applyLang(picker.value));

    async function checkForUpdate() {
      if (busy || updating || !navigator.onLine) return;
      busy = true; setBtn('checking');
      try {
        swReg = swReg || await navigator.serviceWorker.getRegistration();
        if (!swReg) throw new Error('no service-worker registration');
        await swReg.update();                          // network re-check of sw.js
        const incoming = swReg.installing || swReg.waiting;
        if (!incoming) {                               // byte-identical → nothing new
          busy = false; setBtn('current');
          setTimeout(updateNetStatus, 3000);
          return;
        }
        trackUpdate(incoming);
      } catch {
        busy = false; setBtn('error');
      }
    }

    // Drive a freshly-found (or already-waiting) worker to activation, then reload.
    // A worker stuck in the `installed` (waiting) state — e.g. one left behind by an
    // older sw.js that didn't skipWaiting — is nudged via postMessage so it takes
    // over; a watchdog clears the button if nothing happens, so it never hangs.
    function trackUpdate(worker) {
      updating = true; setBtn('updating');
      const nudge = () => { if (worker.state === 'installed') worker.postMessage('skipWaiting'); };
      const onState = () => {
        if (worker.state === 'installed') nudge();         // waiting → ask it to take over
        else if (worker.state === 'activated') reloadOnce(); // active → reload to fresh assets
        else if (worker.state === 'redundant') { updating = false; busy = false; setBtn('error'); }
      };
      worker.addEventListener('statechange', onState);
      onState();                                           // in case it already advanced
      setTimeout(() => {                                   // watchdog: never stay stuck
        if (updating && !reloaded) { updating = false; busy = false; updateNetStatus(); }
      }, 15000);
    }
    btn.addEventListener('click', checkForUpdate);

    applyLang(lang);     // default Chinese (or the persisted choice)
    updateNetStatus();

    // Show the running version. Ask the active worker for its cache name (which carries
    // the version) rather than reading a cached sw.js — so the tag reflects the worker
    // that actually took control after an update, not a possibly-stale cached copy.
    function setVer(t) {
      const m = String(t).match(/offline-games-(\d+\.\d+\.\d+)/);
      if (m) document.getElementById('app-version').textContent = 'v' + m[1] + ' · ';
    }
    function showVersion() {
      const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
      if (sw) {
        const ch = new MessageChannel();
        ch.port1.onmessage = (e) => setVer(e.data);
        sw.postMessage('version', [ch.port2]);
      } else {
        // no worker in control yet (or unsupported) — read sw.js straight from network
        fetch('./sw.js', { cache: 'no-store' }).then((r) => r.text()).then(setVer).catch(() => {});
      }
    }
    showVersion();

    // ---- "Add to Home Screen" helper ----
    // iOS/iPadOS Safari exposes no install API (no beforeinstallprompt / prompt()),
    // so a true one-click install is impossible — the user must use Share → Add to
    // Home Screen. We surface a button that explains that one-time gesture, but only
    // where it applies: iOS Safari, not already installed.
    (function () {
      const ua = navigator.userAgent;
      const installed = navigator.standalone === true ||
        (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      // iPadOS 13+ masquerades as "MacIntel"; the touch-point count reveals a real iPad.
      const isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS || installed) return;            // nothing to do elsewhere / once pinned

      const iBtn = document.getElementById('install-btn');
      const overlay = document.getElementById('install-overlay');
      // Add-to-Home-Screen lives only in Safari proper — absent in Chrome/Firefox iOS
      // and in-app webviews. If we're in one of those, the overlay says to open Safari.
      const notSafari = /CriOS|FxiOS|EdgiOS|OPiOS|GSA|FBAN|FBAV|Instagram|Line\//i.test(ua);
      document.getElementById('install-note').hidden = !notSafari;

      iBtn.hidden = false;
      const close = () => { overlay.hidden = true; };
      iBtn.addEventListener('click', () => { overlay.hidden = false; });
      document.getElementById('install-close').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    })();
  </script>
</body>
</html>
